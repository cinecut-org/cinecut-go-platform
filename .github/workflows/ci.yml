name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cinecut
          POSTGRES_PASSWORD: cinecut
          POSTGRES_DB: cinecut_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cinecut" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://cinecut:cinecut@localhost:5432/cinecut_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -p 1 -race ./...
